<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px 0; border-bottom: 1px solid #ddd; }
    .tag {
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      color: #fff;
    }
    .tag.work     { background: #3b82f6; }
    .tag.school   { background: #f59e0b; }
    .tag.personal { background: #10b981; }
  </style>
</head>
<body>
  <h1>To-Do List</h1>

  <input type="text" id="taskInput" placeholder="New task">

  <select id="categorySelect">
    <option value="Work">Work</option>
    <option value="School">School</option>
    <option value="Personal">Personal</option>
  </select>

  <button id="addBtn">Add</button>

  <ul id="taskList"></ul>

  <script>
    const taskInput = document.getElementById("taskInput");
    const categorySelect = document.getElementById("categorySelect");
    const addBtn = document.getElementById("addBtn");
    const taskList = document.getElementById("taskList");
    const tasks = [];

    function createTask(text, category) {
      return {
        id: Date.now(),
        text: text,
        category: category,
        completed: false
      };
    }

    function renderTask(task) {
      const li = document.createElement("li");

      const span = document.createElement("span");
      span.textContent = task.text;

      const category = task.category || "Personal";
      const tag = document.createElement("span");
      tag.textContent = category;
      tag.className = "tag " + category.toLowerCase();

      li.append(span, tag);
      taskList.appendChild(li);
    }

    addBtn.addEventListener("click", () => {
      const text = taskInput.value.trim();
      if (!text) return;

      const task = createTask(text, categorySelect.value);
      tasks.push(task);
      renderTask(task);
      taskInput.value = "";
    });
  </script>
</body>
</html>
