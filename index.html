<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Class Tasks</h1>
  </header>

  <main>
    <div id="toolbar">
      <form id="add-form">
        <input id="new-task" type="text" placeholder="What needs to be done?" autocomplete="off">
        <button type="submit">Add</button>
      </form>
    </div>

    <ul id="task-list"></ul>

    <p id="counter"></p>
  </main>

  <footer>
    <p>Built by: </p>
  </footer>

  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
