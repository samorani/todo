<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Class Tasks</h1>
    <button id="dnd-toggle" type="button" aria-pressed="false" aria-label="Do not disturb (dark mode)" title="Do not disturb">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <main>
    <div id="toolbar">
      <form id="add-form">
        <input id="new-task" type="text" placeholder="What needs to be done?" autocomplete="off">
        <button type="submit">Add</button>
      </form>
    </div>

    <ul id="task-list"></ul>

    <p id="counter"></p>
  </main>

  <footer>
    <p>Built by: </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
