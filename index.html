<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Class Tasks</h1>
  </header>

  <main>
    <div id="toolbar">
      <form id="add-form">
        <input id="new-task" type="text" placeholder="What needs to be done?" autocomplete="off">
        <select id="task-priority" aria-label="Task priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button type="submit">Add</button>
      </form>
      <div id="filters">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="done">Done</button>
      </div>
    </div>

    <ul id="task-list"></ul>

    <p id="counter"></p>
  </main>

  <footer>
    <p>Built by: </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
