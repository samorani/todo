<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Class Tasks</h1>
  </header>

  <main>
    <div id="toolbar">
      <form id="add-form">
        <input id="new-task" type="text" placeholder="What needs to be done?" autocomplete="off">
        <button type="submit">Add</button>
      </form>
    </div>

    <ul id="task-list"></ul>

    <p id="counter"></p>
  </main>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <p>Delete this task?</p>
      <div class="dialog-buttons">
        <button value="no" class="no-btn">No</button>
        <button value="ok" class="delete-btn">OK</button>
      </div>
    </form>
  </dialog>

  <footer>
    <p>Built by: </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
